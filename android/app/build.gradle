plugins {
    id "com.android.application"
}

android {
    namespace "com.nerfgame"
    compileSdk 35

    defaultConfig {
        applicationId "com.nerfgame"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

// Runs `npm run build` in the repo root, then syncs the dist/ output into
// the generated assets source set so Gradle packages them into the APK.

def webRoot = rootProject.projectDir.parentFile
def webDist = new File(webRoot, "dist")
def generatedAssets = layout.buildDirectory.dir("generated/assets/web")
def webNodeModules = new File(webRoot, "node_modules")
def npmExecutable = System.getProperty("os.name").toLowerCase().contains("windows") ? "npm.cmd" : "npm"

tasks.register("installWebDependencies", Exec) {
    workingDir webRoot
    commandLine npmExecutable, "ci"
    inputs.file(new File(webRoot, "package.json"))
    inputs.file(new File(webRoot, "package-lock.json"))
    outputs.dir(webNodeModules)
}

tasks.register("buildWeb", Exec) {
    dependsOn "installWebDependencies"
    workingDir webRoot
    commandLine npmExecutable, "run", "build"
}

tasks.register("syncWebAssets", Sync) {
    dependsOn "buildWeb"
    from(webDist) {
        exclude "server.cjs"
    }
    into generatedAssets

    doLast {
        def outputDir = generatedAssets.get().asFile
        fileTree(outputDir).matching { include "**/*.html" }.files.each { htmlFile ->
            htmlFile.text = htmlFile.text
                .replace('"/assets/', '"assets/')
                .replace("'/assets/", "'assets/")
        }
    }
}

android.sourceSets.main.assets.srcDir(generatedAssets)

preBuild.dependsOn tasks.named("syncWebAssets")
